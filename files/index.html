<div class="podcast-player podcast-player-redesign articly-theme" data-theme="dark">
  <audio></audio>

  <div class="player-wrap">
    
    <div class="player-header">
      <div class="cover">
        <img class="cover-image" pp-src="coverUrl" pp-alt="title" />
      </div>
      <div class="header-info">
        <div class="ep-title">
          <a pp-href="url" pp-if="url" pp-html="title" target="_parent"></a>
          <span pp-unless="url" pp-html="title"></span>
        </div>
        <div class="ep-subtitle" pp-html="subtitle"></div>
      </div>
    </div>

    <div class="controls-zone main-player">
      
      <div class="progress-bar-wrap">
        <progressbar></progressbar>
      </div>

      <div class="btn-row controls">
        <button class="previous-button ctrl-btn skip" pp-title="translations.previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        
        <button class="backward-button ctrl-btn skip" pp-title="translations.backward">
          <span class="skip-num">10</span>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        
        <button class="play-button ctrl-btn play-btn" pp-title="translations.playPause">
          <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="stop" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        
        <button class="forward-button ctrl-btn skip" pp-title="translations.forward">
          <span class="skip-num">30</span>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
        </button>
        
        <button class="next-button ctrl-btn skip" pp-title="translations.next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
        </button>

        <div class="controls-bottom">
          <select class="speed-select speed-btn" pp-title="translations.changePlaybackSpeed">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panels"></div>
    <div class="footer-right" style="display:none;"><div class="buttons"></div></div>

    <div class="player-footer">
      <div class="brand">
        <span style="color: #fff; font-weight: bold; font-size: 14px; letter-spacing: 1px;">ARTICLY</span>
      </div>
      <div class="footer-actions">
        <button class="share-button footer-btn icon-btn" onclick="document.querySelector('[data-tab=\'share\']').click()" title="Share">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
          </svg>
          Teilen
        </button>
      </div>
    </div>

  </div>
</div>
