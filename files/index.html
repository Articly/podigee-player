<div class="podcast-player podcast-player-redesign mode-script articly-dark-player">
  <div class="podcast-player-inside">
    <audio preload="none"></audio>
    
    <div class="cover-image-player-wrap">
      <div class="cover-image-wrap">
        <img class="cover-image" pp-src="coverUrl | scale 90" pp-alt="title" />
      </div>

      <div class="player-info-wrap">
        <div class="episode-basic-info">
          <div class="episode-title">
            <h1>
              <a pp-href="url" pp-if="url" pp-html="title" target="_parent"></a>
            </h1>
            <h1 pp-unless="url" pp-html="title"></h1>
          </div>
          <div class="episode-subtitle">
            <h2 pp-html="subtitle"></h2>
          </div>
        </div>

        <div class="main-player">
          <div class="controls">
            <button class="previous-button skip-backward-button" pp-title="translations.previous" pp-aria-label="translations.previous"></button>
            <button class="backward-button" pp-title="translations.backward" pp-aria-label="translations.backward"></button>
            <button class="play-button" pp-aria-label="translations.playPause" pp-title="translations.playPause"></button>
            <button class="forward-button" pp-title="translations.forward" pp-aria-label="translations.forward"></button>
            <button class="next-button skip-forward-button" pp-title="translations.next" pp-aria-label="translations.next"></button>
          </div>

          <progressbar></progressbar>

          <div class="controls-bottom">
            <select class="speed-select" pp-title="translations.changePlaybackSpeed" pp-aria-label="translations.changePlaybackSpeed">
              <option value="0.5">0.5x</option>
              <option value="1.0" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2.0">2.0x</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="panels-tabs"></div>
    <div class="panels"></div>

    <div class="footer">
      <div class="footer-left">
        <span class="articly-brand-label">ARTICLY</span>
      </div>
      <div class="footer-right">
        <div class="buttons"></div>
      </div>
    </div>

  </div>
</div>
