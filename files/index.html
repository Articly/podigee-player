<div class="player-shell">

  <div class="player-header">

    <div class="cover">
      {{ podcast.cover }}
    </div>

    <div class="meta">

      <h1>{{ episode.title }}</h1>

      <p>{{ podcast.title }}</p>

    </div>

  </div>

  <div class="player-controls">
    {{ player }}
  </div>

  <div class="player-playlist">
    {{ playlist }}
  </div>

</div>
